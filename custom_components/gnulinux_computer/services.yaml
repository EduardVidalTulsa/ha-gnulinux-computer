service_control:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: gnulinux_computer
    unit:
      required: true
      example: sshd.service
      selector:
        text:
    command:
      required: true
      selector:
        select:
          options: [start, stop, restart, reload, enable, disable]
take_screenshot:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: gnulinux_computer
update_log:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: gnulinux_computer
    lines:
      default: 200
      selector:
        number:
          min: 10
          max: 5000
          mode: box
run_command:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: gnulinux_computer
    command:
      required: true
      example: Backup
      selector:
        text:
use_shared_key:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: gnulinux_computer
    remove_old_key:
      default: true
      selector:
        boolean:
