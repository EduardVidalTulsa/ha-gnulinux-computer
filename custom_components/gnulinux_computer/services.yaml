service_control:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: gnulinux_computer
    unit:
      required: true
      example: sshd.service
      selector:
        text:
    command:
      required: true
      selector:
        select:
          options: [start, stop, restart, reload, enable, disable]
take_screenshot:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: gnulinux_computer
update_log:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: gnulinux_computer
    lines:
      default: 200
      selector:
        number:
          min: 10
          max: 5000
          mode: box
